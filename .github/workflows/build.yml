name: build-fai-base
run-name: fai-base ${{ inputs.fai_version }}
on:
  workflow_dispatch:
    inputs:
      fai_version:
        description: 'The @fathym/fai version to pre-install, e.g. 0.0.888. Builds ghcr.io/fathym/fai-base:<version>.'
        required: true

permissions:
  contents: read
  packages: write

# One build per fai version at a time; a second dispatch of the same version waits.
concurrency:
  group: build-fai-base-${{ inputs.fai_version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the version
        # The version becomes an image tag and a jsr: specifier: only a semantic version passes.
        env:
          FAI_VERSION: ${{ inputs.fai_version }}
        run: |
          if ! printf '%s' "$FAI_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Not a fai version: $FAI_VERSION"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push the base image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: FAI_VERSION=${{ inputs.fai_version }}
          push: true
          tags: ghcr.io/fathym/fai-base:${{ inputs.fai_version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Deno and the fai CLI, pre-installed at one fai version
